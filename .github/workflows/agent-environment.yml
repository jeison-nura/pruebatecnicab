name: Agent environment

on:
  pull_request:
    paths:
      - AGENTS.md
      - .agents/**
      - .opencode/**
      - .github/workflows/agent-environment.yml
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - .agents/**
      - .opencode/**
      - .github/workflows/agent-environment.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate agent environment contracts
        run: node .agents/scripts/validate-environment.mjs

      - name: Evaluate skill routing
        run: node .agents/scripts/run-skill-evals.mjs --min-rank1 95

      - name: Test validators, routing, and OpenCode plugin logic
        run: >-
          node --test
          .agents/scripts/validate-environment.test.mjs
          .agents/scripts/run-skill-evals.test.mjs
          .opencode/plugins/lib/simplify-ignore-core.test.mjs
