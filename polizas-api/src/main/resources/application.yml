spring:
  application:
    name: policies
  datasource:
    url: jdbc:h2:mem:policies;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    # anti-pattern for APIs: no queries during response rendering
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates
      ddl-auto: validate
  flyway:
    schemas: policy, notifications
  h2:
    console:
      enabled: true

server:
  port: 8080
