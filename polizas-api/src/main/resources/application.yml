spring:
  application:
    name: policies
  datasource:
    url: jdbc:h2:mem:policies;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: policy, notifications
  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8080